name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            bun: bun-darwin-arm64
          - target: x86_64-apple-darwin
            bun: bun-darwin-x64
          - target: x86_64-unknown-linux-musl
            bun: bun-linux-x64-musl
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --minify --target=${{ matrix.bun }} src/main.ts --outfile twodo
      - name: Package
        run: tar -czf "twodo-${{ matrix.target }}.tar.gz" twodo
      - uses: actions/upload-artifact@v4
        with:
          name: twodo-${{ matrix.target }}
          path: twodo-${{ matrix.target }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes dist/*.tar.gz
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out the tap
        uses: actions/checkout@v4
        with:
          repository: ajayguru2/homebrew-tap
          ssh-key: ${{ secrets.TAP_DEPLOY_KEY }}
          path: tap

      - name: Write the formula
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          sha() { sha256sum "dist/twodo-$1.tar.gz" | cut -d' ' -f1; }

          cat > tap/Formula/twodo.rb <<EOF
          class Twodo < Formula
            desc "Quiet terminal todo list with one note per task"
            homepage "https://github.com/${GITHUB_REPOSITORY}"
            version "${version}"
            license "MIT"

            on_macos do
              on_arm do
                url "${base}/twodo-aarch64-apple-darwin.tar.gz"
                sha256 "$(sha aarch64-apple-darwin)"
              end
              on_intel do
                url "${base}/twodo-x86_64-apple-darwin.tar.gz"
                sha256 "$(sha x86_64-apple-darwin)"
              end
            end

            on_linux do
              on_intel do
                url "${base}/twodo-x86_64-unknown-linux-musl.tar.gz"
                sha256 "$(sha x86_64-unknown-linux-musl)"
              end
            end

            def install
              bin.install "twodo"
            end

            test do
              assert_path_exists bin/"twodo"
            end
          end
          EOF

          grep -c sha256 tap/Formula/twodo.rb | grep -qx 3

      - name: Push the formula
        working-directory: tap
        shell: bash
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "twodo $GITHUB_REF_NAME"
          git push
