[package]
name = "twodo"
version = "0.1.0"
edition = "2021"
description = "Blazing fast TUI task manager + notes for devs, with automatic AI agent attribution"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
walkdir = "2"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
