[package]
name = "twodo"
version = "0.1.1"
edition = "2021"
description = "A quiet terminal todo list with one note per task"
license = "MIT"
repository = "https://github.com/ajayguru2/twodo"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
